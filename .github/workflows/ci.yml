name: CI

on:
  push:
    branches: [ main, release/1.0 ]
  pull_request:
    branches: [ main, release/1.0 ]

jobs:

  build:
    name: Btrfs CI
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Needed by project-checks
        go-version: 1.23.x
      id: go

    - name: Setup environment
      shell: bash
      run: |
        echo "GOPATH=${{ github.workspace }}" >> $GITHUB_ENV
        echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

    - name: Check out code
      uses: actions/checkout@v4
      with:
        path: src/github.com/containerd/btrfs
        fetch-depth: 25

    - name: Project checks
      uses: containerd/project-checks@v1.2.1
      with:
        working-directory: src/github.com/containerd/btrfs

    - name: Build
      working-directory: src/github.com/containerd/btrfs
      run: |
        sudo apt-get update && sudo apt-get install -y libbtrfs-dev
        make vet binaries
